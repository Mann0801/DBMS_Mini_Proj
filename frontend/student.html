<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CampusEats — Student</title><link rel="stylesheet" href="/css/styles.css">
  <script src="/js/api.js" defer></script><script src="/js/student.js" defer></script>
</head>
<body class="student-page">
  <header class="topbar"><div class="container"><div class="brand">CampusEats <small>Main Canteen</small></div>
    <div class="row"><span>Hi, <strong id="welcome-name"></strong></span><button id="logout-btn" class="small">Log out</button></div></div></header>
  <main class="container student-layout">
    <section class="student-menu stack"><div><h1>Today's menu</h1><p class="muted">Order ahead and pay at the counter.</p></div>
      <form id="menu-filters" class="menu-filters"><div><label for="menu-search">Search dishes</label><input id="menu-search" type="search" maxlength="100" placeholder="Try paneer"></div>
        <div><label for="category-filter">Category</label><select id="category-filter"><option value="">All categories</option></select></div><button type="submit">Search</button></form>
      <div id="menu-message" class="alert error" hidden></div><div id="menu-grid" class="menu-grid" aria-live="polite"></div>
      <section class="card stack"><h2>My orders</h2><div id="orders-list" class="orders-grid" aria-live="polite"></div></section>
    </section>
    <aside class="student-side"><section class="card stack"><h2>Your cart</h2><div id="cart-items"></div>
      <div class="cart-total"><span>Total</span><strong id="cart-total">₹0</strong></div>
      <form id="checkout-form"><button id="checkout-button" class="primary" type="submit" disabled>Place order</button></form>
      <div id="checkout-message" class="alert" hidden></div><p class="muted">Payment is collected at the counter.</p>
    </section></aside>
  </main>
</body></html>
